<!doctype html><html><body style="margin:0;font:16px sans-serif">
<header style="position:sticky;top:0;height:60px;background:#111;color:#fff;z-index:2">Header sticky per tutta la pagina</header>
<main style="padding:40px">
  <div class="sezione">
    <div style="display:grid;grid-template-columns:3fr 2fr;gap:24px">
      <div><div style="height:1400px;background:#ddd">colonna lunga</div></div>
      <div class="colonna">
        <div style="position:sticky;top:80px;height:300px;background:#0af">sticky annidato in una colonna (grid)</div>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px;margin-top:40px">
    <div style="height:200px;background:#eee">prima</div>
    <div style="display:flex;gap:24px">
      <div style="flex:1;height:1200px;background:#ccc">testo lungo</div>
      <div style="flex:1"><div style="height:40px">titolo sopra</div><div style="position:sticky;top:0;height:200px;background:#fa0">sticky annidato a più livelli (flex)</div></div>
    </div>
    <div style="height:600px;background:#eee">dopo</div>
  </div>
</main>
</body></html>
