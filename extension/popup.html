<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { font: 13px/1.4 Inter, system-ui, sans-serif; width: 280px; margin: 0; padding: 16px; color: #fff; background: #000; -webkit-font-smoothing: antialiased; }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; gap: 9px; }
  label { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; color: #ddd; cursor: pointer; }
  input[type=checkbox] { appearance: none; flex: none; width: 16px; height: 16px; margin: 1px 0 0; border: 1px solid #444; border-radius: 3px; background: #000; cursor: pointer; display: grid; place-content: center; }
  input[type=checkbox]:checked { background: #fff; border-color: #fff; }
  input[type=checkbox]:checked::after { content: ''; width: 8px; height: 4px; border: solid #000; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  label.row { align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px solid #2a2a2a; }
  select { padding: 5px 8px; border: 1px solid #444; border-radius: 3px; background: #111; color: #fff; font: inherit; font-size: 12px; }
  button { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #fff; border-radius: 4px; background: #fff; color: #000; font: inherit; font-weight: 600; cursor: pointer; transition: background .15s, color .15s; }
  button:hover:not(:disabled) { background: #000; color: #fff; }
  button.alt { background: #000; color: #fff; border-color: #444; }
  button.alt:hover:not(:disabled) { border-color: #fff; }
  button:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 1px solid #fff; outline-offset: 2px; }
  #status { margin-top: 12px; min-height: 16px; color: #8a8a8a; font-size: 12px; word-break: break-word; }
</style>
</head>
<body>
  <h1><svg viewBox="0 0 128 128" width="20" height="20" aria-hidden="true"><path d="M64 14 L119 109 H9 Z" fill="#000" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><circle cx="64" cy="77" r="22" fill="#000" stroke="#fff" stroke-width="7"/></svg>Circles&amp;Triangles</h1>
  <label><input type="checkbox" id="scroll" checked> Scorri la pagina prima (carica lazy images)</label>
  <label><input type="checkbox" id="raster" checked> Testi anche come immagine (per i font che non hai)</label>
  <label><input type="checkbox" id="carousel" checked> Caroselli interattivi (varianti Figma)</label>
  <label><input type="checkbox" id="hover" checked> Hover sulle immagini (variante Hover)</label>
  <label><input type="checkbox" id="anim" checked> Animazioni continue (Figma Motion)</label>
  <label class="row">Larghezza pagina <select id="vw"><option value="1728" selected>1728 px (MacBook Pro 16")</option><option value="1440">1440 px (desktop)</option><option value="1920">1920 px</option><option value="1280">1280 px</option><option value="390">390 px (mobile)</option><option value="0">finestra attuale</option></select></label>
  <button id="copy">Cattura e copia</button>
  <button id="download" class="alt">Cattura e scarica .json</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
